        /* General styling */
        body {

        .project {
            margin-bottom: 30px;

            padding-bottom: 20px;
        }

        .project:last-child {

            margin-bottom: 0;
            padding-bottom: 0;
        }

        .project h2 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #333;
        }

        .project p {
            color: #666;
        }

        .project img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px 0;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
